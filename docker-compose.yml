volumes:
  langgraph-data:
    driver: local
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8123:8123"
    depends_on:
      - langgraph-api
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
  langgraph-redis:
    image: redis:6
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 1s
      retries: 5
  langgraph-api:
    image: ${IMAGE_NAME}
    expose:
      - "8000"
    depends_on:
      langgraph-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URI: redis://langgraph-redis:6379
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      DATABASE_URI: ${DATABASE_URI}
