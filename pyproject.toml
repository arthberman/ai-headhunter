[project]
name = "repio-ai"
version = "0.0.1"
description = "AI Agents for repio.co"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3.16",
  "langchain-community>=0.3.16",
  "langchain-anthropic>=0.3.4",
  "langchain-core>=0.3.32",
  "langgraph>=0.2.68",
  "langchain-openai>=0.3.2",
  "pydantic>=2.10.6",
  "langchain-aws>=0.2.11",
  "trustcall>=0.0.28",
  "python-dotenv>=1.0.1",
  "asyncpg>=0.30.0",
  "langgraph-sdk>=0.1.51",
  "tavily-python>=0.5.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
  "ipykernel>=6.29.5",
  "langgraph-cli[inmem]>=0.1.69",
  "mypy>=1.14.1",
  "ruff>=0.9.3",
  "toml>=0.10.2",
]

[tool.setuptools]
packages = [
  "matcher",
  "setup",
  "utils",
  "security",
  "feeder",
  "company_researcher",
  "feedback",
  "feedback_chat",
]

[tool.ruff]
include = ["*.py", "*.pyi", "*.ipynb"]

[tool.setuptools.package-dir]
matcher = "src/matcher"
setup = "src/setup"
utils = "src/utils"
feeder = "src/feeder"
security = "src/security"
company_researcher = "src/company_researcher"
feedback = "src/feedback"
feedback_chat = "src/feedback_chat"
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D401", "T201", "UP"]
ignore = ["UP006", "UP007", "UP035", "D417", "E501", "D100"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"ntbk/*" = ["D", "UP", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"
