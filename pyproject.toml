[project]
name = "repio-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "langchain>=0.2.14",
    "langchain-community>=0.2.12",
    "langchainhub>=0.1.21",
    "langchain-anthropic>=0.1.23",
    "langchain-groq>=0.1.9",
    "langchain-core>=0.2.34",
    "langgraph>=0.2.14",
    "langchain-postgres>=0.0.9",
    "langchain-openai>=0.1.22",
    "bullmq>=2.9.2",
    "pydantic>=2.8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/matcher", "src/parser", "src/utils"]
