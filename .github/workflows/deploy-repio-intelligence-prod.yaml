name: Deploy repio-intelligence to Production

on:
  #  push:
  #    branches:
  #      - main
  #    paths:
  #      - "src/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-repio-intelligence-prod:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-deploy-repio-intelligence-prod
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Make envfile
        uses: SpicyPizza/create-envfile@v2.0
        with:
          envkey_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          envkey_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          envkey_FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          envkey_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          envkey_LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          envkey_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          envkey_TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          envkey_TEMPORAL_API_KEY: ${{ secrets.TEMPORAL_API_KEY }}
          envkey_LANGCHAIN_PROJECT: ${{ vars.LANGCHAIN_PROJECT }}
          envkey_TEMPORAL_HOST_URL: ${{ vars.TEMPORAL_HOST_URL }}
          envkey_TEMPORAL_NAMESPACE: ${{ vars.TEMPORAL_NAMESPACE }}
          envkey_LANGCHAIN_TRACING_V2: "true"
          envkey_LANGCHAIN_ENDPOINT: "https://eu.api.smith.langchain.com"
          file_name: .env
          fail_on_empty: true

      - name: Build, tag, and push repio-intelligence image to Amazon ECR
        id: build-intelligence-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: prod/repio-intelligence
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/repio-intelligence-prod-task-definition.json
          container-name: repio-intelligence-prod-container
          image: ${{ steps.build-intelligence-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: repio-intelligence-prod-service
          cluster: repio-prod-cluster
          wait-for-service-stability: true
